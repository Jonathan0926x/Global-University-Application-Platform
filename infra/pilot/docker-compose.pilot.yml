version: '3.8'

# Controlled Private Pilot Stack (Synthetic Test Users Only; Zero Public Exposure)
# Bindings restricted to 127.0.0.1 loopback behind private VPN/reverse proxy.

services:
  postgres_pilot:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks:
      - pilot_internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uniglobe_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-uniglobe_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata_pilot:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniglobe_pilot} -d ${POSTGRES_DB:-uniglobe_pilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav_pilot:
    image: clamav/clamav:stable
    restart: unless-stopped
    networks:
      - pilot_internal
    volumes:
      - clamav_db_pilot:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

  api_pilot:
    image: ${UNIGLOBE_API_IMAGE:-uniglobe-api:pilot}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - pilot_internal
      - pilot_public_egress
    env_file:
      - .env.pilot
    depends_on:
      postgres_pilot:
        condition: service_healthy
      clamav_pilot:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3

  web_pilot:
    image: ${UNIGLOBE_WEB_IMAGE:-uniglobe-web:pilot}
    restart: unless-stopped
    user: "10001:10001"
    networks:
      - pilot_internal
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - api_pilot

networks:
  pilot_internal:
    internal: true
  pilot_public_egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-uniglobe-pilot-egress

volumes:
  pgdata_pilot:
  clamav_db_pilot:
