version: '3.8'

# Controlled Private Pilot Stack (Synthetic Test Users Only; Zero Public Exposure)
# Bindings restricted strictly to 127.0.0.1 loopback behind private VPN/reverse proxy.

services:
  postgres_pilot:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks:
      - pilot_internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uniglobe_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-uniglobe_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata_pilot:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniglobe_pilot} -d ${POSTGRES_DB:-uniglobe_pilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate_pilot:
    build:
      context: ../..
      dockerfile: infra/pilot/Dockerfile.api
    user: "10001:10001"
    networks:
      - pilot_internal
    env_file:
      - .env.pilot
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres_pilot:
        condition: service_healthy
    restart: "no"

  clamav_pilot:
    image: clamav/clamav:stable
    restart: unless-stopped
    networks:
      - pilot_internal
    volumes:
      - clamav_db_pilot:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  api_pilot:
    build:
      context: ../..
      dockerfile: infra/pilot/Dockerfile.api
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - pilot_internal
      - pilot_public_egress
    env_file:
      - .env.pilot
    depends_on:
      migrate_pilot:
        condition: service_completed_successfully
      clamav_pilot:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3

  web_pilot:
    build:
      context: ../..
      dockerfile: infra/pilot/Dockerfile.web
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.next/cache:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.pilot
    networks:
      - pilot_internal
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      api_pilot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  pilot_internal:
    internal: true
  pilot_public_egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-uniglobe-pilot-egress

volumes:
  pgdata_pilot:
  clamav_db_pilot:
