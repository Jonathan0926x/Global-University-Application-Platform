version: '3.8'

# Hardened production compose configuration for UniGlobe API workers & data stores.
# Uses network segmentation so `postgres` and `redis` reside strictly on an internal
# non-routable bridge, paired with host-level `egress-iptables.sh` rules blocking RFC1918
# and 169.254.169.254 egress from worker containers.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    networks:
      - internal_data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uniglobe}
      POSTGRES_USER: ${POSTGRES_USER:-uniglobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniglobe} -d ${POSTGRES_DB:-uniglobe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - internal_data
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_worker:
    image: ${UNIGLOBE_API_IMAGE:-uniglobe-api:latest}
    restart: always
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_data
      - public_egress
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-uniglobe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uniglobe}
      ENABLE_AUTOMATED_EXPIRY_SWEEPS: "true"
      ROUTE_EXPIRY_SWEEP_INTERVAL_SECONDS: "3600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

networks:
  internal_data:
    internal: true
  public_egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-uniglobe-egress

volumes:
  pgdata:
  redisdata:
